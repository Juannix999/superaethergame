<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="thrusterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#0284c7" stroke-width="6" />

  <!-- Targeting Grid reticles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="10 6" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.25" />
  <line x1="256" y1="50" x2="256" y2="462" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.2" />
  <line x1="50" y1="256" x2="462" y2="256" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Afterburner plume -->
  <path d="M 236 410 Q 256 490 276 410 Z" fill="#38bdf8" filter="url(#thrusterGlow)" opacity="0.9" />
  <path d="M 244 410 Q 256 460 268 410 Z" fill="#ffffff" filter="url(#thrusterGlow)" />

  <!-- Jet Fighter Silhouette: F-22 Air Superiority Jet -->
  <!-- Main Fuselage and Wings -->
  <path d="
    M 256 70
    L 272 170
    L 330 250
    L 440 330
    L 410 360
    L 310 340
    L 300 400
    L 282 410
    L 256 395
    L 230 410
    L 212 400
    L 202 340
    L 102 360
    L 72 330
    L 182 250
    L 240 170
    Z
  " fill="url(#jetGrad)" stroke="#7dd3fc" stroke-width="5" stroke-linejoin="round" />

  <!-- Twin Vertical Stabilizers -->
  <polygon points="215,350 190,410 215,400" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <polygon points="297,350 322,410 297,400" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />

  <!-- Wing Leading Edge Slats / Panel accents -->
  <line x1="272" y1="170" x2="435" y2="330" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" />
  <line x1="240" y1="170" x2="77" y2="330" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" />

  <!-- Cockpit Gold Tint Canopy -->
  <path d="M 256 140 Q 268 180 266 230 Q 256 245 246 230 Q 244 180 256 140 Z" fill="url(#canopyGrad)" stroke="#fef08a" stroke-width="2" />
</svg>
